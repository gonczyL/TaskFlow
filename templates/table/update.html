<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In Form</title>

<!-- navigation bar -->
<style>
    body {
        font-family: Arial, sans-serif;
        background-color: white;
        color: #004d4a;
        margin: 0;
        padding: 0;
    }
    
    h2 {
        text-align: center;
        color: #004d4a;
        margin-top: 20px;
    }
    
    form {
        max-width: 500px;
        margin: 30px auto;
        padding: 30px;
        border: 2px solid #004d4a;
        border-radius: 8px;
        background-color: #f9f9f9;
    }
    
    label {
        display: block;
        margin-top: 15px;
        font-weight: bold;
    }
    
    input[type="text"],
    select {
        width: 100%;
        padding: 10px;
        margin-top: 5px;
        border: 1px solid #ccc;
        border-radius: 4px;
        box-sizing: border-box;
        font-size: 14px;
    }
    
    button {
        background-color: #004d4a;
        color: white;
        border: none;
        padding: 10px 20px;
        margin-top: 20px;
        margin-right: 10px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 14px;
        transition: background-color 0.3s ease;
    }
    
    button:hover {
        background-color: #006a67;
    }
    
    button:last-of-type {
        margin-right: 0;
    }
    
</style>
<ul>
    <li><a class="active" href="/">Home</a></li>
    <li><a class="active" href="/add">Add New Issue</a></li>
    <li><a class="active" href="/signout">SignOut</a></li>
</ul>

<!-- navigation bar end -->
</head>
<body>
    <h2>Update issue</h2>
    <h2>{{ current_issue }}</h2>
    <form method="POST" action="/issue/{{current_issue.id}}">
        {% csrf_token %}
        <label for="title">title</label>
        <input type="text" id="title" name="title" value={{ current_issue.title }}>
        <label for="description">description</label>
        <input type="text" id="description" name="description" value={{ current_issue.description }}>
        <label for="logged_time">Logged time:</label>
        <input type="text" id="logged_time" name="logged_time" value={{ current_issue.logged_time }}>
        <label for="asigned">Asigned user: {{ current_issue.asigned }}</label>
        <select name="dropdownName" id="dropdownId">
            {% for user in users %}
                <option value="{{ user.id }}">{{ user.username }}</option>
            {% empty %}
                <option value="">Select a user...</option>
            {% endfor %}
        </select>
    </div>
        <button type="submit" name="action" value="save">Save</button>
        <button type="submit" name="action" value="delete_issue" onclick="return confirmDelete()">Delete Issue</button>
        <button type="submit" name="action" value="cancel">Cancel</button>
    </form>
    <script>
        function confirmDelete() {
            return confirm("Are you sure you want to delete this?");
        }
    </script>
</body>

</html>
